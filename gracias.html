<!doctype html>
<html lang="es-PY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gracias | Enerpy Ambiental</title>
<meta name="description" content="Confirmación de contacto con Enerpy Ambiental.">
<!-- A confirmation page has nothing to offer a search result, and indexing it
     would strand people on a dead end from Google. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#013540">
<link rel="icon" href="img/enerpy-color.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<link rel="stylesheet" href="styles.css?v=79">
</head>
<body class="thanks-body">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="ico-check" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.6 4.8 4.8L19.5 7.2"/>
  </symbol>
</svg>

<main class="thanks" id="main">
  <div class="thanks__card">

    <a class="thanks__brand" href="index.html" aria-label="Enerpy Ambiental — volver al inicio">
      <img src="img/enerpy-color.svg" alt="" width="506" height="225">
    </a>

    <span class="thanks__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><use href="#ico-check"></use></svg>
    </span>

    <h1 class="thanks__h" id="thanks-h">Gracias por escribirnos.</h1>

    <p class="thanks__p" id="thanks-p">
      Recibimos su consulta. Un especialista de Enerpy Ambiental se pone en contacto
      con usted por WhatsApp.
    </p>

    <div class="thanks__actions">
      <a class="btn btn--primary" id="thanks-back" href="index.html">
        <span>Volver al inicio</span>
      </a>
    </div>

  </div>
</main>

<script src="main-gracias.js?v=79" defer></script>
</body>
</html>
